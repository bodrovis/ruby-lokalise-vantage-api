plugins:
 - rubocop-performance
 - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable

Metrics/MethodLength:
  Max: 15
  
RSpec/MultipleExpectations:
  Max: 20

RSpec/ExampleLength:
  Max: 50

RSpec/MultipleMemoizedHelpers:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb